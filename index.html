<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>FlowQueue</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <link rel="icon" type="image/png" href="img/avatar.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css?v=43">
</head>
<body>

<div id="app">
  <header>
    <div class="fq-navbar-brand" style="display:flex; align-items:center;">
      <img src="img/brand_mark.png" alt="FlowQueue Home" style="height: 48px; object-fit: contain; cursor: pointer;">
    </div>
    <div class="quick-add-bar">
      <input id="quick-add-input" type="text" placeholder="Quick capture — press Enter to save…" autocomplete="off" disabled onkeydown="if (event.key === 'Enter') OAD.submitQuickAdd();">
    </div>
    <div class="header-actions">
      <!-- Nav injected dynamically by OAD.renderHeaderActions() -->
    </div>
  </header>

  <div id="main">
    <div id="list-panel">
      <div id="persona-bar"></div>
      <div id="list-toolbar">
        <input id="search-input" type="text" placeholder="Search threads…" data-i18n-placeholder="searchPlaceholder" oninput="OAD.renderList()">
        <button onclick="OAD.openNewThreadModal()" data-i18n="newThread">+ New</button>
      </div>
      <div id="thread-list"></div>
    </div>

    <div id="detail-panel">
      <div id="detail-content">
        <div class="detail-empty">Select a thread to view details</div>
      </div>
    </div>
  </div>
</div>

<!-- Layer order: supabase → supabase-client → data → threadTemporalStatus → engine → due → mailroom → api → render → modals → seed → tests → boot -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.29.2/cytoscape.min.js"></script>
<script src="js/supabase-client.js?v=43"></script>
<!-- Demo credentials — gitignored, absent in prod/local dev. Silent no-op if file not present. -->
<script>window.OAD = window.OAD || {}; OAD.DemoConfig = null;</script>
<script src="js/demo_boot.js" onerror="void 0"></script>
<script>
  // Automatic Client State Wipe (Demo/Fresh Instance Detection)
  if (typeof OAD.BootID !== 'undefined') {
    if (localStorage.getItem('oad_boot_id') !== OAD.BootID) {
      console.log('✨ New instance fingerprint detected. Wiping previous state.');
      localStorage.clear();
      sessionStorage.clear();
      localStorage.setItem('oad_boot_id', OAD.BootID);
      sessionStorage.setItem('oad_fresh_demo_seed_required', 'true');
    }
  }
</script>
<script src="js/demo_data_sync.js" onerror="void 0"></script>
<script src="js/demo.config.js" onerror="void 0"></script>
<script src="js/module.config.js" onerror="void 0"></script>
<script src="js/config.js?v=43"></script>
<script src="js/models.js?v=43"></script>
<script src="js/data.js?v=43"></script>
<!-- Demo role visibility rules register into core's OAD.register*VisibilityFilter hooks
     (js/data.js) — must load after data.js defines them, before anything renders. -->
<script src="modules/demo/roles.js" onerror="void 0"></script>
<!-- Pure, DOM-free, zero-dependency temporal-status module (ticket-flowqueue-temporal-and-schema.md)
     — loads before engine.js because OAD.isActionOverdue/isDeadlineOverdue now delegate to it. -->
<script src="js/threadTemporalStatus.js?v=1"></script>
<script src="js/engine.js?v=43"></script>
<script src="js/due.js?v=43"></script>
<script src="js/mailroom.js?v=43"></script>
<script src="js/api.js?v=43"></script>
<script src="js/render.js?v=43"></script>
<!-- Command Center (My Team nav) is entirely clinical-demo content — lives in the fq-demo
     module, not core. Needs OAD.highlightNav (js/render.js) to already be defined. -->
<script src="modules/demo/dashboard.js" onerror="void 0"></script>
<script src="js/modals.js?v=43"></script>
<script src="tests/tests.data.js?v=43"></script>
<script src="tests/tests.js?v=43"></script>
<script>OAD.boot();</script>

</body>
</html>
