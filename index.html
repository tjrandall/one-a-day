<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>FlowQueue</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <link rel="icon" type="image/png" href="img/avatar.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css?v=17">
</head>
<body>

<div id="app">
  <header>
    <div class="fq-navbar-brand" style="display:flex; align-items:center;">
      <img src="img/brand_mark.png" alt="FlowQueue Home" style="height: 48px; object-fit: contain; cursor: pointer;">
    </div>
    <div class="header-actions">
      <div class="nav-dropdown">
        <button class="ghost" style="font-weight:600">Views</button>
        <div class="nav-dropdown-content">
          <button onclick="OAD.renderDailyView()" data-i18n="dailySummary">Daily Summary</button>
          <button onclick="OAD.renderListView()" data-i18n="list">List</button>
          <button onclick="OAD.renderTodayView()" data-i18n="today">Today</button>
          <button onclick="OAD.renderMatrixView()" data-i18n="matrix">Matrix</button>
          <button id="nav-graph-btn" onclick="OAD.renderGraphView()" data-i18n="graph">Graph</button>
        </div>
      </div>
      
      <div class="nav-dropdown">
        <button class="ghost" style="font-weight:600">Queues</button>
        <div class="nav-dropdown-content">
          <button onclick="OAD.renderIdeaPanel()" data-i18n="ideas">Ideas</button>
          <button onclick="OAD.renderHabitPanel()" data-i18n="habits">Habits</button>
          <button onclick="OAD.renderCadencePanel()" data-i18n="cadences">Cadences</button>
          <button onclick="OAD.renderProposalsPanel()" data-i18n="proposals">Proposals</button>
          <button onclick="OAD.openMailroomModal()" style="color:var(--accent);font-weight:600" data-i18n="scanMail">📥 Scan Mail</button>
        </div>
      </div>

      <button class="ghost" onclick="OAD.renderCommandCenter()" style="font-weight:600;color:var(--primary)" data-i18n="myTeam">My Team</button>
      <button class="ghost" onclick="OAD.openSettingsModal()" data-i18n="settings">Settings</button>
      <button id="che-badge" class="ghost" onclick="OAD.openHealthPanel()" style="display:none;font-size:12px;padding:4px 10px;font-weight:600"></button>
    </div>
  </header>

  <div id="main">
    <div id="list-panel">
      <div id="persona-bar"></div>
      <div id="list-toolbar">
        <input id="search-input" type="text" placeholder="Search threads…" data-i18n-placeholder="searchPlaceholder" oninput="OAD.renderList()">
        <button onclick="OAD.openNewThreadModal()" data-i18n="newThread">+ New</button>
      </div>
      <div id="thread-list"></div>
    </div>

    <div id="detail-panel">
      <div id="detail-content">
        <div class="detail-empty">Select a thread to view details</div>
      </div>
    </div>
  </div>
</div>

<!-- Layer order: supabase → supabase-client → data → engine → api → render → modals → seed → tests → boot -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.29.2/cytoscape.min.js"></script>
<script src="js/supabase-client.js?v=17"></script>
<script src="js/config.js?v=17"></script>
<!-- Demo credentials — gitignored, absent in prod/local dev. Silent no-op if file not present. -->
<script>window.OAD = window.OAD || {}; OAD.DemoConfig = null;</script>
<script src="js/demo.config.js" onerror="void 0"></script>
<script src="js/data.js?v=17"></script>
<script src="js/engine.js?v=17"></script>
<script src="js/mailroom.js?v=17"></script>
<script src="js/api.js?v=17"></script>
<script src="js/render.js?v=17"></script>
<script src="js/dashboard.js?v=17"></script>
<script src="js/modals.js?v=17"></script>
<script src="tests/tests.data.js?v=17"></script>
<script src="tests/tests.js?v=17"></script>
<script>OAD.boot();</script>

</body>
</html>
